<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hola Mi Vida 💛</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }body {
  background: linear-gradient(135deg, #fff6b7, #f7d547);
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
}

.container {
  z-index: 2;
  animation: fadeIn 2s ease;
}

h1 {
  font-size: 4rem;
  color: #7a5200;
  text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
  margin-bottom: 20px;
}

p {
  font-size: 1.5rem;
  color: #5a3d00;
}

.flower {
  position: absolute;
  width: 60px;
  height: 60px;
  background: radial-gradient(circle, #7a5200 15%, transparent 16%),
              radial-gradient(circle, #ffeb3b 40%, transparent 41%);
  border-radius: 50%;
  animation: float 10s linear infinite;
  opacity: 0.8;
}

@keyframes float {
  0% {
    transform: translateY(100vh) rotate(0deg);
  }
  100% {
    transform: translateY(-120vh) rotate(360deg);
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.8);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.signature {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  color: #5a3d00;
  font-size: 1rem;
  z-index: 2;
}

@media (max-width: 600px) {
  h1 {
    font-size: 2.5rem;
  }

  p {
    font-size: 1.1rem;
    padding: 0 20px;
  }
}

  </style>
</head>
<body>  <div class="container">
    <h1>Hola Mi Vida 💛</h1>
    <p>Eres la flor más bonita de mi vida 🌻</p>
  </div>  <div class="signature">
    De nada, espero mis likes 😎
  </div>  <script>
    for (let i = 0; i < 25; i++) {
      const flower = document.createElement('div');
      flower.classList.add('flower');

      flower.style.left = Math.random() * 100 + 'vw';
      flower.style.animationDuration = (6 + Math.random() * 8) + 's';
      flower.style.width = flower.style.height = (40 + Math.random() * 40) + 'px';

      document.body.appendChild(flower);
    }
  </script></body>
</html>
